   <script>

        // Add click event to stat cards
        document.querySelectorAll('.stat-card').forEach(card => {
            card.addEventListener('click', function() {
                const type = this.dataset.type;
                showPersonCards(type);
            });
        });

        // Function to show person cards
        function showPersonCards(type) {
            const container = document.getElementById('person-cards-container');
            
            // Clear previous cards
            container.innerHTML = '<div class="loading-indicator">กำลังโหลดข้อมูล...</div>';

            // Call Google Apps Script function to get person data
            google.script.run
                .withSuccessHandler(function(persons) {
                    // Clear loading indicator
                    container.innerHTML = '';

                    // Filter persons based on the selected type
                    const filteredPersons = filterPersonsByType(persons, type);

                    // Create and append person cards
                    filteredPersons.forEach(person => {
                        const personCard = document.createElement('div');
                        personCard.classList.add('person-card');
                        personCard.innerHTML = `
                            <img src="${person.imageUrl || ''}" alt="${person.name}" class="person-card-image">
                            <div class="person-card-info">
                                <h3>${person.name}</h3>
                                <p><strong>ตำแหน่ง:</strong> ${person.position || 'ไม่ระบุ'}</p>
                                <p><strong>แผนก:</strong> ${person.department || 'ไม่ระบุ'}</p>
                                <p><strong>อีเมล:</strong> ${person.email || 'ไม่มีข้อมูล'}</p>
                                <p><strong>โทรศัพท์:</strong> ${person.phone || 'ไม่มีข้อมูล'}</p>
                            </div>
                        `;
                        container.appendChild(personCard);
                    });

                    // Show message if no persons found
                    if (filteredPersons.length === 0) {
                        container.innerHTML = '<div class="loading-indicator">ไม่พบข้อมูลสำหรับประเภทนี้</div>';
                    }
                })
                .withFailureHandler(function(error) {
                    container.innerHTML = `<div class="loading-indicator">เกิดข้อผิดพลาด: ${error}</div>`;
                })
                .getPersonData_3();
        }

        // Function to filter persons by type
        function filterPersonsByType(persons, type) {
            switch(type) {
                case 'contract':
                    return persons.filter(p => p.employeeType === 'สัญญาบัตร');
                case 'intern':
                    return persons.filter(p => p.employeeType === 'ประทวน');
                case 'civilServant':
                    return persons.filter(p => p.employeeType === 'พนักงานราชการ');
                case 'total':
                default:
                    return persons;
            }
        }

        // Mock data loading function
        document.addEventListener('DOMContentLoaded', function() {
            try {
                google.script.run.withSuccessHandler(updateDashboardData_2).getPersonData_2();
            } catch (e) {
                // Use mock data for testing
                setTimeout(() => {
                    updateDashboardData_2({
                        totalEmployees: 999,
                        contract: 999,
                        intern: 999,
                        civilServant: 999
                    });
                }, 500);
            }
        });

        // Function to update dashboard data
        function updateDashboardData_2(data) {
            document.getElementById('total-employees_2').textContent = data.totalEmployees || '--';
            document.getElementById('total-contract_2').textContent = data.contract || '--';
            document.getElementById('total-retiring_2').textContent = data.intern || '--';
