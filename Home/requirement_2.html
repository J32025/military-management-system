<script>

// เรียกใช้งานฟังก์ชันดึงข้อมูลจาก Google Apps Script เมื่อโหลดหน้า
google.script.run.withSuccessHandler(requirshowData).requirment_rentGetData();

function requirshowData(dataSet) {
    // แสดง loading
    // showLoading();

    // ตรวจสอบว่า dataSet มีข้อมูลหรือไม่
    if (!dataSet || !Array.isArray(dataSet)) {
        console.error('ไม่มีข้อมูลหรือข้อมูลไม่ถูกต้อง');
        // hideLoading();
        return;
    }

    // Ensure each row has the required number of columns
    dataSet = dataSet.map(row => {
        while (row.length < 20) { // เพิ่มเป็น 20 คอลัมน์เพื่อรองรับ URL รูปภาพ
            row.push('');
        }
        return row;
    });

    // เรียงลำดับข้อมูลตามค่าเช่าบ้านจากมากไปน้อย
    dataSet.sort((a, b) => {
        const rentA = parseFloat(a[3]); // ค่าเช่าบ้านอยู่ในคอลัมน์ที่ 3
        const rentB = parseFloat(b[3]);
        return rentB - rentA; // เรียงจากมากไปน้อย
    });

    // Initialize DataTable
    const table = new DataTable('#requirment_rent', {
        columns: [
            {
                title: 'รูปประจำตัว',
                width: '5%',
                responsivePriority: 3,
                render: function (data, type, row) {
                    const picUrl = row[0] || 'https://img2.pic.in.th/pic/Untitled-designa64a7773ec4d81e9.png';
                    if (type === 'display' && picUrl) {
                        return `<img src="${picUrl}" alt="รูปภาพ" class="profile-image" onerror="this.onerror=null;this.src='https://img2.pic.in.th/pic/Untitled-designa64a7773ec4d81e9.png';">`;
                    }
                    return '';
                }
            },
            {
                title: 'ยศ ชื่อ-สกุล',
                width: '10%',
                responsivePriority: 2 // ลำดับความสำคัญรองลงมา
            },
            {
                title: 'ตำแหน่ง',
                width: '3%',
                responsivePriority: 5 // ลำดับความสำคัญต่ำสุด จะซ่อนก่อน
            },
            {
                title: 'ค่าเช่าบ้าน',
                width: '3%',
                responsivePriority: 2 // ลำดับความสำคัญต่ำสุด จะซ่อนก่อน
            },
            {
                title: 'รายละเอียด',
                width: '5%',
                responsivePriority: 1, // ลำดับความสำคัญสูงสุดเท่ากับลำดับ
                render: function (data, type, row) {
                    const rank_name_last = row[1] || '';
                    if (type === 'display') {
                        return `<span class='badge bg-success text-white sfont view-details'
                                  data-id="${rank_name_last}"
                                  data-bs-toggle="modal"
                                  data-bs-target="#requirment_rent_modal">ดูข้อมูล</span>`;
                    }
                    return '';
                }
            }
        ],
        data: dataSet.length > 1 ? dataSet.slice(1) : [],
        bFilter: true,
        responsive: {
            details: {
                type: 'column',
                target: 'tr'
            }
        },
        language: {
            url: '//cdn.datatables.net/plug-ins/1.13.5/i18n/th.json',
            search: "ค้นหา:",
            lengthMenu: "แสดง _MENU_ รายการ",
            info: "แสดง _START_ ถึง _END_ จากทั้งหมด _TOTAL_ รายการ",
            infoEmpty: "ไม่พบรายการ",
            infoFiltered: "(กรองจากทั้งหมด _MAX_ รายการ)",
            paginate: {
                first: "หน้าแรก",
                last: "หน้าสุดท้าย",
                next: "ถัดไป",
                previous: "ก่อนหน้า"
            }
        },
        destroy: true,
        order: [[0, 'asc']],
        columnDefs: [
            {
                targets: '_all',
                className: 'dt-center align-middle'
            }
        ],
        dom: '<"row"<"col-sm-12 col-md-6"l><"col-sm-12 col-md-6"f>>' +
             '<"row"<"col-sm-12"tr>>' +
             '<"row"<"col-sm-12 col-md-5"i><"col-sm-12 col-md-7"p>>',
        lengthMenu: [[10, 25, 50, -1], [10, 25, 50, "ทั้งหมด"]],
        initComplete: function (settings) {
            const api = new $.fn.dataTable.Api(settings);

            // เพิ่ม event listener สำหรับปุ่มดูข้อมูล
            $('#requirment_rent').on('click', '.view-details', function() {
                const id = $(this).data('id');
                newFetchrequirment_rentData(id);
            });

            hideLoading(); // ซ่อน loading เมื่อโหลดตารางเสร็จ
        }
    });

    // เพิ่ม event listener สำหรับการปรับขนาดหน้าจอ
    $(window).on('resize', function() {
        table.columns.adjust().responsive.recalc();
    });

    $.fn.DataTable.ext.pager.numbers_length = 5;
}


// ฟังก์ชันแสดง loading
function showLoading() {
    if (!$('#loading_1_1').length) {
        $('body').append(`
            <div id="loading_1_1">
                <div class="loading_1_1-spinner"></div>
                <p class="mt-3">กำลังโหลดข้อมูล...</p>
            </div>
        `);
    } else {
        $('#loading_1_1').show();
    }
}

// ฟังก์ชันซ่อน loading
function hideLoading() {
    $('#loading_1_1').fadeOut(300);
}

<script>
  function newFetchrequirment_rentData(roomNumber) {
    // ตรวจสอบว่า roomNumber มีค่าหรือไม่
    if (!roomNumber) {
        alert('ข้อมูลไม่ถูกต้อง');
        return;
    }

    // ตั้งค่าและแสดง LoadingOverlay
    if (typeof $.LoadingOverlay === 'function') {
        $.LoadingOverlaySetup({
            background      : "rgba(0, 0, 0, 0.5)",
            image           : "https://img2.pic.in.th/pic/Untitled-designa64a7773ec4d81e9.png",
            imageAnimation  : "1.5s fadein",
            imageColor      : "#ffcc00"
        });
        $.LoadingOverlay("show");
    } else {
        console.warn('LoadingOverlay ไม่ได้ถูกโหลด');
    }

    // เรียก Google Apps Script เพื่อดึงข้อมูล
    google.script.run
        .withSuccessHandler(handlerequirData_rent)
        .withFailureHandler(handlerequirError_rent)
        .fetchDataByrequir_rent(roomNumber);
}

function handlerequirData_rent(data) {
    // ซ่อน LoadingOverlay เมื่อได้รับข้อมูล
    if (typeof $.LoadingOverlay === 'function') {
        $.LoadingOverlay("hide");
    }

    // ตรวจสอบข้อมูลและแสดงในฟอร์ม
    if (data && data.length > 0) {
        requireditData_rent(data[0]);
    } else {
        alert('ไม่พบข้อมูล');
    }
}

function handlerequirError_rent(error) {
    // ซ่อน LoadingOverlay เมื่อเกิดข้อผิดพลาด
    if (typeof $.LoadingOverlay === 'function') {
        $.LoadingOverlay("hide");
    }
    
    alert('เกิดข้อผิดพลาด: ' + (error && error.message ? error.message : 'ไม่ทราบสาเหตุ'));
}
