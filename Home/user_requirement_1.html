<script>

function requirshowData_001(dataSet) {

        return;
    }

    // Ensure each row has the required number of columns
    dataSet = dataSet.map(row => {
        while (row.length < 20) { // เพิ่มเป็น 20 คอลัมน์เพื่อรองรับ URL รูปภาพ
            row.push('');
        }
        return row;
    });

    // Initialize DataTable
const table = new DataTable('#requirment_001', {
    columns: [
        {
            title: 'ลำดับ',

            title: 'รูปประจำตัว',
            width: '5%',
            responsivePriority: 3,
            render: function (data, type, row) {
                const picUrl = row[1] || 'https://img2.pic.in.th/pic/Untitled-designa64a7773ec4d81e9.png';

                    return `<img src="${picUrl}" alt="รูปภาพ" class="profile-image" onerror="this.onerror=null;this.src='https://img2.pic.in.th/pic/Untitled-designa64a7773ec4d81e9.png';">`;

            $('#requirment_001').on('click', '.view-details', function() {

    // เพิ่ม event listener สำหรับการปรับขนาดหน้าจอ
    $(window).on('resize', function() {
        table.columns.adjust().responsive.recalc();
    });

    $.fn.DataTable.ext.pager.numbers_length = 5;
}

// ฟังก์ชันแสดง loading
function showLoading() {
    if (!$('#loading_1_1_001').length) {
        $('body').append(`
            <div id="loading_1_1_001">
                <div class="loading_1_1-spinner"></div>
                <p class="mt-3">กำลังโหลดข้อมูล...</p>
            </div>
        `);
    } else {
        $('#loading_1_1_001').show();
    }
}

// ฟังก์ชันซ่อน loading
function hideLoading() {
    $('#loading_1_1_001').fadeOut(300);
}

</script>

<script>
  function newFetchrequirmentData_1_001(roomNumber) {
    // ตรวจสอบว่า roomNumber มีค่าหรือไม่
    if (!roomNumber) {
        alert('ข้อมูลไม่ถูกต้อง');
        return;
    }

    // ตั้งค่าและแสดง LoadingOverlay
    if (typeof $.LoadingOverlay === 'function') {
        $.LoadingOverlaySetup({
            background      : "rgba(0, 0, 0, 0.5)",
            image           : "https://img2.pic.in.th/pic/Untitled-designa64a7773ec4d81e9.png",
            imageAnimation  : "1.5s fadein",
            imageColor      : "#ffcc00"
        });
        $.LoadingOverlay("show");
    } else {
        console.warn('LoadingOverlay ไม่ได้ถูกโหลด');
    }

    // เรียก Google Apps Script เพื่อดึงข้อมูล
    google.script.run
        .withSuccessHandler(handlerequirData_001)
        .withFailureHandler(handlerequirError_001)
        .fetchDataByrequir(roomNumber);
}

function handlerequirData_001(data) {
    // ซ่อน LoadingOverlay เมื่อได้รับข้อมูล
    if (typeof $.LoadingOverlay === 'function') {
        $.LoadingOverlay("hide");
    }

    // ตรวจสอบข้อมูลและแสดงในฟอร์ม
    if (data && data.length > 0) {
        requireditData_001(data[0]);
    } else {
        alert('ไม่พบข้อมูล');
    }
}

function handlerequirError_001(error) {
    // ซ่อน LoadingOverlay เมื่อเกิดข้อผิดพลาด
    if (typeof $.LoadingOverlay === 'function') {
        $.LoadingOverlay("hide");
    }

    alert('เกิดข้อผิดพลาด: ' + (error && error.message ? error.message : 'ไม่ทราบสาเหตุ'));
}

function requireditData_001(data) {
    // ตรวจสอบว่า data มีค่าหรือไม่
    if (!data || !Array.isArray(data)) {
        console.error('ข้อมูลที่ได้รับไม่ถูกต้อง');
        return;
    }

    // ฟังก์ชันช่วยกำหนดค่า element แบบปลอดภัย
    function setValueSafely(elementId, value) {
        const element = document.getElementById(elementId);
        if (element) {
            element.value = value || '';
        } else {
            console.warn(`ไม่พบ element ที่มี ID: ${elementId}`);
        }
    }

    // ฟังก์ชันอัปเดตสถานะ checkbox
    function updateCheckbox(elementId, value) {
        const checkbox = document.getElementById(elementId);
        if (checkbox) {
            checkbox.checked = !!value;
        } else {
            console.warn(`ไม่พบ checkbox ที่มี ID: ${elementId}`);
        }
    }

    // กำหนดค่าในฟอร์ม
    setValueSafely('requirment01_001', data[0]); // ลำดับ
    setValueSafely('requirment02_001', data[2]); // ยศ ชื่อ สกุล

    setValueSafely('requirment06_001', data[6]);
    setValueSafely('requirment07_001', data[7]);
    setValueSafely('requirment08_001', data[8]);
    setValueSafely('requirment09_001', data[9]);
    setValueSafely('requirment10_001', data[10]);
    setValueSafely('requirment11_001', data[11]);
    setValueSafely('requirment12_001', data[12]);
    setValueSafely('requirment13_01_001', data[1]);

    // อัปเดตสถานะ checkbox ตามข้อมูล

    // ตรวจสอบว่ามี URL ของรูปภาพหรือไม่
