<style>
  :root {
    --primary: #4361ee;
    --secondary: #3f37c9;
    --success: #4cc9f0;
    --info: #4895ef;
    --warning: #f72585;
    --danger: #e63946;
    --light: #f8f9fa;
    --dark: #212529;
    --gray: #6c757d;
    --gray-light: #f1f3f5;
    --body-bg: #f5f7fa;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  .dashboard-container {
    max-width: auto;
    margin: 0 auto;
    padding: 0 15px;
  }

  .header_2 {
    background: linear-gradient(50deg, #ADD8E6, #ADD8E6);
    color: black;
    padding: 15px 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .header_2 h1 {
    font-size: 24px;
    font-weight: 600;
  }

  .header_3 {
    background: linear-gradient(50deg, #ADD8E6, #ADD8E6);
    color: black;
    padding: 15px 20px;
    border-radius: 10px;
    margin-top: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .header_3 h1 {
    font-size: 24px;
    font-weight: 600;
  }

  .date-display {
    font-size: 14px;
    opacity: 0.9;
  }

  .chart-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }

  .chart-grid_2 {
    display: grid;
    /* grid-template-columns: repeat(2, 1fr); */
    gap: 20px;
  }

  .chart-card {
    background-color: white;
    border-radius: 5px;
    overflow: hidden;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2), 0 2px 4px rgba(0, 0, 0, 0.15);
    border: 1px solid #ddd;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .chart-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25), 0 4px 8px rgba(0, 0, 0, 0.2);
  }

  .chart-header {
    padding: 15px 20px;
    border-bottom: 1px solid var(--gray-light);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .chart-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--dark);
  }

  .chart-body {
    padding: 20px;
    height: 300px;
    position: relative;
    width: 100%;
  }

  .chart-footer {
    padding: 10px 20px;
    border-top: 1px solid var(--gray-light);
    font-size: 12px;
    color: var(--gray);
    display: flex;
    justify-content: space-between;
  }

  .stat-change {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .stat-change.positive {
    color: #2ecc71;
  }

  .stat-change.negative {
    color: #e74c3c;
  }

  /* แก้ไขส่วนการตอบสนองต่อขนาดหน้าจอ */
  @media (max-width: 992px) {
    .chart-grid, .chart-grid_2 {
      grid-template-columns: 1fr 1fr;
    }
    
    .chart-body {
      height: 280px;
    }
  }

  @media (max-width: 768px) {
    .chart-grid, .chart-grid_2 {
      grid-template-columns: 1fr;
    }

    .header_2, .header_3 {
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    .chart-body {
      height: 260px;
    }
  }

  @media (max-width: 480px) {
    .chart-body {
      height: 240px;
      padding: 10px;
    }
    
    .chart-header {
      padding: 10px 15px;
    }
    
    .chart-title {
      font-size: 14px;
    }
  }
</style>

<script>
  const genderCtx = document.getElementById('genderChart').getContext('2d');
    const genderChart = new Chart(genderCtx, {
      type: 'bar',
      data: {
        labels: ['ทุ่ง 1 อาคาร 9', 'ทุ่ง 1 อาคาร 13', 'ทุ่ง 2 อาคาร 10', 'ทุ่ง 3 อาคาร 1', 'ทุ่ง 3 อาคาร 33'],
        datasets: [
          {
            label: 'ชาย',
            data: [26, 15, 19, 13, 9],
            backgroundColor: 'rgba(72, 149, 239, 0.7)',
            borderColor: 'rgba(72, 149, 239, 1)',
            borderWidth: 1,
            borderRadius: 5
          },
          {
            label: 'หญิง',
            data: [6, 9, 13, 3, 9],
            backgroundColor: 'rgba(247, 37, 133, 0.7)',
            borderColor: 'rgba(247, 37, 133, 1)',
            borderWidth: 1,
            borderRadius: 5
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'top',
            labels: {
              boxWidth: 12,
              padding: 15,
              font: {
                size: 11
              }
            }
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            grid: {
              display: true,
              color: 'rgba(0, 0, 0, 0.05)'
            }
          },
          x: {
            grid: {
              display: false
            },
            ticks: {
              callback: function(value, index, values) {
                // ชั้นที่ 1: ชื่ออาคาร
                const layer1 = ['ทุ่ง 1 อาคาร 9', 'ทุ่ง 1 อาคาร 13', 'ทุ่ง 2 อาคาร 10', 'ทุ่ง 3 อาคาร 1', 'ทุ่ง 3 อาคาร 33'][index];
                // ชั้นที่ 2: กกก, ขขข, คคค, ...
                const layer2 = ['สนผ.', 'สปก.', 'สวฝ.', 'ศสภ.', 'กกล.'][index];
                return `${layer1}\n${layer2}`;
              },
              font: {
                size: 11
              }
            }
          }
        }
      }
    });
</script>
