    // เพิ่มคอลัมน์ว่างใน dataSet ถ้าจำนวนคอลัมน์ไม่ตรงกับที่ต้องการ
    dataSet = dataSet.map(row => {
        while (row.length < 19) { // 19 คือจำนวนคอลัมน์ที่ต้องการ (0-18)
            row.push(''); // เพิ่มคอลัมน์ว่าง
        }
        return row;
    });

        columns: [
            { title: 'ลำดับ', width: '3%' }, // กำหนดความกว้าง 3%
            { title: 'หมายเลขห้อง', width: '5%' }, // กำหนดความกว้าง 5%

            { title: 'หมายเลขอาคาร', width: '7%' }, // กำหนดความกว้าง 7%
            { title: 'ประเภท', width: '5%' }, // กำหนดความกว้าง 5%
            { title: 'ยศ', width: '5%' }, // กำหนดความกว้าง 5%

            { title: 'นามสกุล', width: '7%' }, // กำหนดความกว้าง 7%
            { title: 'ตำแหน่ง', width: '7%' }, // กำหนดความกว้าง 7%
            { title: 'สังกัด', width: '7%' }, // กำหนดความกว้าง 7%
            { title: 'สถานะการจัด', width: '7%' }, // กำหนดความกว้าง 7%
            { title: 'จำนวนผู้พักอาศัยตามทะเบียนบ้าน', width: '10%' }, // กำหนดความกว้าง 10%

                title: 'รายละเอียด', // ย้ายคอลัมน์ "รายละเอียด" ไปไว้ที่ตำแหน่งสุดท้าย

                render: function (data) {
                    if (data === "Active") {
                        return `<span class='badge bg-success text-white sfont'
                                    data-bs-toggle="modal"
                                    data-bs-target="#detailsModal_1A2AB" type="button"
                                    onclick="closestatus_edit(this);"></i>ดูข้อมูล</span>`;
                    } else if (data === "InActive") {
                        data = "<span class='badge bg-danger text-white sfont'>ว่าง</span>";
                    } else if (data === "ไม่อนุมัติ") {
                        data = "<span class='badge bg-danger text-white sfont'>ไม่อนุมัติ</span>";

                        data = "<span class='badge bg-info text-white sfont'>ส่งคืน</span>";
                    } else if (data === "กำลังใช้งาน") {
                        data = "<span class='badge bg-primary text-white sfont'>กำลังใช้งาน</span>";
                    }
                    return data;
                }
            }

        bFilter: true,
        responsive: true, // เปิดใช้งาน responsive

}
