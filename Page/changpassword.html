<!-- Modal -->
<div class="modal fade" id="changpassword" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
  aria-labelledby="staticBackdropLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="staticBackdropLabel">แก้ไขรหัสผ่านด้วยตนเอง</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formresetpass" onsubmit="resetPass()">
          <div class="mb-3">
            <label for="uname" class="form-label">ชื่อเข้าสู่ระบบ</label>
            <input type="text" class="form-control" id="uname" name="uname" placeholder="ระบุรหัสผ่านเดิม" readonly>
          </div>
          <div class="mb-3">
            <label for="formGroupExampleInput2" class="form-label">รหัสผ่านใหม่</label>
            <input type="password" class="form-control" id="newpassword" name="newpassword" placeholder="ระบุรหัสผ่านใหม่ที่ต้องการไม่เกิน6หลัก" maxlength="6" required>
          </div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-primary">บันทึกการเปลี่ยนแปลงรหัสผ่าน</button>
      </div>
      </form>
    </div>
  </div>
</div>

<script>
  function resetPass(){
  let uname = document.getElementById('uname').value.trim()
  let newpassword = document.getElementById('newpassword').value.trim()
  Swal.fire({
      position: 'center',
      title: '<h4>กำลังเปลี่ยนรหัสผ่านในฐานข้อมูล...</h4>',
      showConfirmButton: false,
      })
      Swal.showLoading()
  event.preventDefault()
  google.script.run.withSuccessHandler((output)=>{
  document.getElementById('newpassword').value=""
      Swal.fire({
          position: 'top',
          icon: 'success',
          title: '<h4>เปลี่ยนรหัสผ่านเรียบร้อยแล้ว</h4>',
          showConfirmButton: false,
          timer: 2500
          })
    console.log('สำเร็จ')
  }).resetPassword(uname,newpassword)  

}
</script>
