<style>
  #totaldata-table td {
    font-weight: normal;
    /* ให้เป็นตัวบาง */
    font-size: 14px;
    color: #333;
  }
  /* จัดข้อความในตารางให้อยู่ตรงกลาง */
#totaldata-table td, #totaldata th {
    /* text-align: center; จัดข้อความในแนวนอน */
    vertical-align: middle; /* จัดข้อความในแนวตั้ง */
}
  #totaldata-table {
    table-layout: fixed;
    width: 100%;
}
#totaldata-table tbody tr {
    height: 50px; /* กำหนดความสูงของแถว */
}

#totaldata-table tbody td {
    overflow: hidden; /* ซ่อนเนื้อหาที่เกิน */
    white-space: nowrap; /* ไม่ให้ข้อความขึ้นบรรทัดใหม่ */
    text-overflow: ellipsis; /* แสดง ... เมื่อข้อความยาวเกิน */
}
#totaldata-table thead th {
    height: 30px; /* กำหนดความสูงของหัวคอลัมน์ */
    overflow: hidden; /* ซ่อนเนื้อหาที่เกิน */
    white-space: nowrap; /* ไม่ให้ข้อความขึ้นบรรทัดใหม่ */
    text-overflow: ellipsis; /* แสดง ... เมื่อข้อความยาวเกิน */
    background-color: #add8e6; /* สีพื้นหลัง */
    border: 1px solid #dee2e6; /* เส้นขอบ */
}

#totaldata-table thead th:first-child {
    border-top-left-radius: 10px; /* ขอบมนด้านบนซ้าย */
    border-bottom-left-radius: 10px; /* ขอบมนด้านล่างซ้าย */
}

#totaldata-table thead th:last-child {
    border-top-right-radius: 10px; /* ขอบมนด้านบนขวา */
    border-bottom-right-radius: 10px; /* ขอบมนด้านล่างขวา */
}

</style>

<h1 class="mb-2"><i class="fa-solid fa-building"></i> สรุปรายงาน</h1>

  </table>
</div>

          var api = new $.fn.dataTable.Api(settings);
          $('.table-filter-container', api.table().container()).append();

          $('#table-filter select').on('change', function(){
            table.columns(17).search(this.value).draw();
          });
