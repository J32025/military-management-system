<!-- The Modal -->
<div class="modal" id="cancel">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header bg-danger text-white">
        <h4 class="modal-title text-white">แบบฟอร์มยกเลิกการจองรถ</h4>
        <button type="button" id="cancelbtn-close" class="btn-close text-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="cancelmyForm" onsubmit="cancelForm(this)" class="row g-2">

          <input type="text" id="numid_cancel" name="numid_cancel" hidden>

          <div class="col-6 col-md-3 mb-2">
            <label>&nbspชื่อผู้จอง</label>
            <input type="text" class="form-control" id="name_cancel" name="name_cancel" style="color:blue; border:none; background:none;" readonly>
          </div>

          <div class="col-6 col-md-3 mb-2">
            <label>&nbspแผนก</label>
            <input type="text" class="form-control" id="dep_cancel" name="dep_cancel" style="color:blue; border:none; background:none;" readonly>
          </div>

          <div class="col-6 col-md-3 mb-2">
            <label>&nbspรถคันที่จอง</label>
            <input type="text" class="form-control" id="car_cancel" name="car_cancel" style="color:blue; border:none;" >
          </div>

          <div class="col-6 col-md-3 mb-2">
            <label>&nbspสถานที่ๆไปติดต่อ</label>
            <input type="text" class="form-control" id="loca_cancel" name="loca_cancel" style="color:blue; border:none; background:none;" readonly>
          </div>

          <div class="col-6 col-md-3 mb-2">
            <label>&nbspวันที่จองไว้</label>
            <input type="text" class="form-control" id="startDate_cancel" name="startDate_cancel" style="color:blue; border:none; background:none;"readonly>
          </div>

          <div class="col-6 col-md-3 mb-2">
            <label>&nbspเวลาออก</label>
            <input type="text" class="form-control" id="startTime_cancel" name="startTime_cancel" style="color:blue; border:none; background:none;"readonly>
          </div>

          <div class="col-6 col-md-3 mb-2">
            <label>&nbspกำหนดคืนรถวันที่</label>
            <input type="text" class="form-control" id="endDate_cancel" name="endDate_cancel" style="color:blue;border:none; background:none;"readonly>
          </div>

          <div class="col-6 col-md-3 mb-2">
            <label>&nbspกำหนดคืนรถเวลา</label>
            <input type="text" class="form-control" id="endTime_cancel" name="endTime_cancel" style="color:blue;border:none; background:none;"readonly>
          </div>
           
           <input type="text" class="form-control" id="drive_cancel" name="drive_cancel" style="color:blue;display:none;" readonly>

          <input type="text" class="form-control" id="other_cancel" name="other_cancel" style="color:blue;display:none;" readonly>


          <div class="col-12 col-md-6 mb-2">
            <div class="form-group"> <label>&nbspสถานะ</label>
              <div class="input-group mb-3">
                <span class="input-group-text"><i class="fa-solid fa-house-chimney-user"></i></span>
                <select class="form-select" id="preapporved_cancel" name="preapporved_cancel" aria-label="Default select example" style="color:blue;">
                      <option value="ยกเลิกการจองรถ">ยกเลิกการจองรถ</option>

                </select>
              </div>
            </div>
          </div>

          <div class="col-12 col-md-6 mb-2">
            <div class="form-group"> <label>&nbspชื่อผู้ยกเลิก</label>
              <div class="input-group mb-3">
                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                <input type="text" class="form-control" id="namecancel_car" name="namecancel_car" style="color:blue;" required readonly>
              </div>
            </div>
          </div>



          <div class="d-flex justify-content-center mt-4">
            <button type="submit" class="btn bg-danger col-12 text-white"><i class="fas fa-paper-plane"></i> ยืนยันยกเลิกการจองรถ</button>
          </div>
        </form>




      </div>
    </div>
  </div>
</div>




<h1 class="mb-2"><i class="fa-solid fa-circle-xmark"></i> ยกเลิกข้อมูลการจองรถ</h1>
<div class="table-responsive">

 <thead class="bg-danger text-white"></thead>
  </table>
</div>



<script>
  function cancelForm(obj){
        event.preventDefault()
          Swal.fire({
            position: 'center',
            title: '<i class="fa-solid fa-download fa-bounce me-2"></i><h4><br>กำลังบันทึกข้อมูล...</h4>',
            showConfirmButton: false,
          })
           Swal.showLoading()

       google.script.run.withSuccessHandler(canceladdSuccess).cancelRecord(obj)
       }
      function canceladdSuccess(result){
       if(result == true){
  
          Swal.fire({
            position: 'center',
            icon: 'success',
           
            text: 'ยกเลิกการจองรถเรียบร้อยแล้ว',
            //showConfirmButton: true,
            showConfirmButton: false,
            timer: 2500
           })
           document.getElementById("cancelbtn-close").click(); 
           google.script.run.withSuccessHandler(cancelshowData).cancelgetdata()
      }
       }

       ],

    $.fn.DataTable.ext.pager.numbers_length = 5;

 function canceleditData(el){

  var dep_cancel = el.parentNode.parentNode.cells[2].innerText

// console.log(record)
