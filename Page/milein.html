 
<div class="modal" id="carin">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header bg-primary text-white">
        <h4 class="modal-title text-white">แบบฟอร์มบันทึกการใช้รถขาเข้า</h4>
        <button type="button" id="mileinbtn-close" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="mileinmyForm" onsubmit="mileinsubmitForm(this)" class="row g-2">

          <input type="text" id="numid_milein" name="numid_milein" hidden>

          <div class="col-6 col-md-3 mb-2">
            <label>&nbspชื่อผู้จอง</label>
            <input type="text" class="form-control" id="name_milein" name="name_milein" style="color:blue; border:none; background:none;" readonly>
          </div>

          <div class="col-6 col-md-3 mb-2">
            <label>&nbspแผนก</label>
            <input type="text" class="form-control" id="dep_milein" name="dep_milein" style="color:blue; border:none; background:none;" readonly>
          </div>

          <div class="col-6 col-md-3 mb-2">
            <label>&nbspรถคันที่กลับเข้ามา</label>
            <input type="text" class="form-control" id="car_milein" name="car_milein" style="color:blue; border:none;" >
          </div>

          <div class="col-6 col-md-3 mb-2">
            <label>&nbspสถานที่ๆไปติดต่อ</label>
            <input type="text" class="form-control" id="loca_milein" name="loca_milein" style="color:blue; border:none; background:none;" readonly>
          </div>

          <!-- ซ่อนวันและเวลาเริ่มต้น -->
          <input type="text" class="form-control" id="startDate_milein" name="startDate_milein" style="display:none;">
          <input type="text" class="form-control" id="startTime_milein" name="startTime_milein" style="display:none;">
          <!-- วันและเวลาเริ่มต้น -->

          <!-- ซ่อนวันและเวลาสิ้นสุด -->
          <input type="text" class="form-control" id="endDate_milein" name="endDate_milein" style="display:none;">
          <input type="text" class="form-control" id="endTime_milein" name="endTime_milein" style="display:none;">
          <!-- วันและเวลาสิ้นสุด -->


          <div class="col-6 col-md-3 mb-2">
            <label>&nbspวันที่เริ่มใช้งานรถ</label>
            <input type="text" class="form-control" id="dateout_milein" name="dateout_milein" style="color:blue;border:none; background:none;"readonly>
          </div>

          <div class="col-6 col-md-3 mb-2">
            <label>&nbspเวลาที่เริ่มใช้งานรถ</label>
            <input type="text" class="form-control" id="timeout_milein" name="timeout_milein" style="color:blue;border:none; background:none;"readonly>
          </div>

          <div class="col-6 col-md-3 mb-2">
            <label>&nbspวันที่คืนรถ</label>
            <input type="date" class="form-control" id="datein_milein" name="datein_milein" style="color:blue;" required>
          </div>

          <div class="col-6 col-md-3 mb-2">
            <label>&nbspเวลาที่คืนรถ</label>
            <input type="time" class="form-control" id="timein_milein" name="timein_milein" style="color:blue;" required>
          </div>

          <!-- ซ่อนสถานะกับชื่อผู้อนุมัติ -->
          <input type="text" class="form-control" id="preapporved_milein" name="preapporved_milein" value="ส่งคืน" style="display:none;">
          <input type="text" class="form-control" id="apporve_milein" name="apporve_milein"style="display:none;">
          <input type="text" class="form-control" id="mileout_milein" name="mileout_milein"style="display:none;">
          <input type="text" class="form-control" id="drive_milein" name="drive_milein"style="display:none;">
          <!-- สถานะกับชื่อผู้อนุมัติ -->

          <div class="col-12 col-md-6 mb-2">
            <label>&nbspอื่นๆ</label>
            <input type="text" class="form-control" id="other_milein" name="other_milein" style="color:blue;">
          </div>



          <div class="col-6 col-md-3 mb-2">
            <label>&nbspเลขไมล์เข้า</label>
            <input type="number" class="form-control" id="milein_milein" name="milein_milein" style="color:blue;" required>
          </div>

          <div class="col-6 col-md-3 mb-2">
            <label>&nbspชื่อคนขับ</label>
            <input type="text" class="form-control" id="driver_milein" name="driver_milein" style="color:blue;" readonly>
          </div>
          <div class="d-flex justify-content-center mt-4">
            <button type="submit" class="btn bg-primary col-12 text-white"><i class="fas fa-paper-plane"></i> บันทึกเลขไมล์เข้า</button>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>

  <script>


      function mileinshowData(dataSet){
   table = new DataTable('#mileincar', {
    //header = dataSet
    //console.log(dataSet)
    columns: [
        { title: 'ไอดี' },
        { title: 'ชื่อผู้จอง' },
        { title: 'แผนก' },
        { title: 'รถ' },
        { title: 'สถานที่ๆไปติดต่อ' },
        { title: 'วันที่ออก' },
        { title: 'เวลาออก' },
        { title: 'วันที่เข้า' },
        { title: 'เวลาเข้า' },
        { title: 'คนขับ' },
        { title: 'อื่นๆ' },
       { title: 'สถานะ' ,    
        targets: 11,
           render: function (data) {    
        if(data ==="รออนุมัติ"){
        data = "<span class='badge bg-warning text-white sfont'>รออนุมัติ</span>";
        }else if(data ==="อนุมัติ") {
        data = "<span class='badge bg-success text-white sfont'>อนุมัติ</span>";
        }else if(data ==="ไม่อนุมัติ") {
        data = "<span class='badge bg-danger text-white sfont'>ไม่อนุมัติ</span>";
        }else if(data ==="ยกเลิกการจองรถ") {
        data = "<span class='badge bg-danger text-white sfont'>ยกเลิกการจองรถ</span>";
        }else if(data ==="ส่งคืน") {
        data = "<span class='badge bg-info text-white sfont'>ส่งคืน</span>";
        }else if(data ==="กำลังใช้งาน") {
        data = "<span class='badge bg-primary text-white sfont'><i class='fa-solid fa-car-side fa-shake'></i>กำลังใช้งาน</span>";
        }
        return data;
        }
        }, 
        { title: 'ผู้อนุมัติ' },
        { title: 'วันที่ออก' },
        { title: 'เวลาออก' },
        { title: 'เลขไมล์ออก' },
        { title: 'คนขับ' },
        { title: 'แก้ไข' ,    
        targets: 17,
            data: null,
            defaultContent: '&nbsp&nbsp&nbsp<i class="fa-solid fa-pencil fa-xl" style="color: green; cursor: pointer;" data-bs-toggle="modal" data-bs-target="#carin" onclick="mileineditData(this);"></i>',
        },
    ],
    data: dataSet,
    responsive: true,
    destroy:true,
      language: {
        url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/th.json',
    },
    
    "destroy": true,
      order: [[0, 'asc']],
      columnDefs:[
          {
          targets: [17],className: 'all',},
       ],
      //จำกัดให้แสดงปุ่มหน้าตามจำนวนที่ต้องการ
         initComplete: function(settings){
          var api = new $.fn.dataTable.Api( settings );
          $('.table-filter-container', api.table().container()).append(
          );

           $('#table-filter select').on('change', function(){
             table.columns(17).search(this.value).draw();   
          });
          }
      });    
        //It will show only 4 pager buttons.
    $.fn.DataTable.ext.pager.numbers_length = 5;
    }

  function mileintsearchData(obj) {
      event.preventDefault()
        Swal.fire({
            position: 'center',
            title: '<i class="fa-solid fa-truck-fast fa-beat"></i><h4><br>กำลังค้นหาข้อมูล...</h4>',
            showConfirmButton: false,
          })
           Swal.showLoading()
            google.script.run.withSuccessHandler(data=>{
              if(data != ''){
                mileinshowData(data)
                const Toast = Swal.mixin({
                  toast: true,
                  position: 'top-end',
                  showConfirmButton: false,
                  timer: 3000,
                  timerProgressBar: true,
                  didOpen: (toast) => {
                    toast.addEventListener('mouseenter', Swal.stopTimer)
                    toast.addEventListener('mouseleave', Swal.resumeTimer)
                  }
                })

                Toast.fire({
                  icon: 'success',
                  title: 'พบข้อมูลที่ท่านจองไว้แล้ว'
                })
                  $('#showtb_carin').show()
                    mileinshowData(data)
              }else{
                  Swal.fire({
                    position: 'top',
                    icon: 'warning',
                    title:'แจ้งให้ทราบ',
                    text: 'ชื่อผู้ใช้นี้ยังไม่ได้รับการอนุมัติจากผู้ดูแลระบบ หรือยังไม่ได้มีการจองรถเข้ามา',
                    showConfirmButton: false,
                    timer: 3000
                  })
                  $('#showtb_carin').hide()
              }
            
            
            }).milein_searchData(obj);
            
            }
