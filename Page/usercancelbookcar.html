<div class="modal" id="car_cancelbook">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header bg-danger text-white">
        <h4 class="modal-title text-white"><i class="fa-solid fa-circle-info"></i> แสดงรายละเอียดการจอง</h4>
        <button type="button" id="cancelcarbookbtn-close" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="cancelcarbookmyForm" onsubmit="cancelcarbooksubmitForm(this)" class="row g-2">

            <input type="text" id="numid_canceluser" name="numid_canceluser" hidden>

          <div class="col-6 col-md-3 mb-2">
            <label>&nbspชื่อผู้จอง</label>
            <input type="text" class="form-control" id="name_canceluser" name="name_canceluser" style="color:blue; border:none; background:none;" readonly>
          </div>

          <div class="col-6 col-md-3 mb-2">
            <label>&nbspแผนก</label>
            <input type="text" class="form-control" id="dep_canceluser" name="dep_canceluser" style="color:blue; border:none; background:none;" readonly>
          </div>

          <div class="col-6 col-md-3 mb-2">
            <label>&nbspรถคันที่จอง</label>
            <input type="text" class="form-control" id="car_canceluser" name="car_canceluser" style="color:blue; border:none;" >
          </div>

          <div class="col-6 col-md-3 mb-2">
            <label>&nbspสถานที่ๆไปติดต่อ</label>
            <input type="text" class="form-control" id="loca_canceluser" name="loca_canceluser" style="color:blue; border:none; background:none;" readonly>
          </div>

          <div class="col-6 col-md-3 mb-2">
            <label>&nbspวันที่จองไว้</label>
            <input type="text" class="form-control" id="startDate_canceluser" name="startDate_canceluser" style="color:blue; border:none; background:none;"readonly>
          </div>

          <div class="col-6 col-md-3 mb-2">
            <label>&nbspเวลาออก</label>
            <input type="text" class="form-control" id="startTime_canceluser" name="startTime_canceluser" style="color:blue; border:none; background:none;"readonly>
          </div>

          <div class="col-6 col-md-3 mb-2">
            <label>&nbspกำหนดคืนรถวันที่</label>
            <input type="text" class="form-control" id="endDate_canceluser" name="endDate_canceluser" style="color:blue;border:none; background:none;"readonly>
          </div>

          <div class="col-6 col-md-3 mb-2">
            <label>&nbspกำหนดคืนรถเวลา</label>
            <input type="text" class="form-control" id="endTime_canceluser" name="endTime_canceluser" style="color:blue;border:none; background:none;"readonly>
          </div>
           
           <input type="text" class="form-control" id="drive_canceluser" name="drive_canceluser" style="color:blue;display:none;" readonly>

          <input type="text" class="form-control" id="other_canceluser" name="other_canceluser" style="color:blue;display:none;" readonly>


          <div class="col-12 col-md-6 mb-2">
            <div class="form-group"> <label>&nbspสถานะ</label>
              <div class="input-group mb-3">
                <span class="input-group-text"><i class="fa-solid fa-house-chimney-user"></i></span>
                  <input type="text" class="form-control" id="preapporved_canceluser" name="preapporved_canceluser" value="ยกเลิกการจองรถ" style="color:blue;" readonly>
              </div>
            </div>
          </div>

          <div class="col-12 col-md-6 mb-2">
            <div class="form-group"> <label>&nbspชื่อผู้ยกเลิก</label>
              <div class="input-group mb-3">
                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                <input type="text" class="form-control" id="driver_canceluser" name="driver_canceluser" style="color:blue;" readonly>
              </div>
            </div>
          </div>



          <div class="d-flex justify-content-center mt-4">
            <button type="submit" class="btn bg-danger col-12 text-white"><i class="fas fa-paper-plane"></i>ยืนยันยกเลิกการจอง</button>
          </div>




        </form>
      </div>
    </div>
  </div>
</div>

<h1 class="mb-3"><i class="fa-solid fa-ban"></i> ยกเลิกการจองรถ</h1>
<form id="cancelcarbooktmyForm" class="form-inline" onsubmit="cancelcarbooktsearchData(this)">
    <div class="row">
      <div class="col-12 col-md-6 mb-2">
        <label>ชื่อผู้จองรถ</label>
        <input  type="text" class="form-control sm" id="searchname_cancel" name="searchname_cancel" placeholder="ระบุชื่อผู้จอง" style="color:blue;"  readonly>
        </div>

        <div class="col-12 col-md-6 mb-2">
         <label>เลือกสถานะที่ต้องการยกเลิก</label>
           <select class="form-select" id="searchcar_cancel" name="searchcar_cancel" aria-label="Default select example" style="color:blue;" required>
            <option value=''>กรุณาเลือกสถานะ</option>
            <option value="อนุมัติ">อนุมัติ</option>
            <option value="รออนุมัติ">รออนุมัติ</option>
    </select>
      </div>
   
      <div class="d-grid gap-2 col-6 mx-auto mt-2">
        <button type="submit" class="btn btn-danger"  type="button">แสดงข้อมูล</button>
      </div>
  
  </form>

  <div class="table-responsive" id="showtb_carcancel">
    <table id="cancelcarbookuser" class="table table-striped table-sm table table-hover align-middle"
      style="width:100%; font-size:14px;">
      <thead class="bg-danger text-white"></thead>
    </table>
  </div>
  </div>
  <script>

      function cancelcarbookshowDatauser(dataSet){
   table = new DataTable('#cancelcarbookuser', {
    //header = dataSet
    //console.log(dataSet)
    columns: [
        { title: 'ไอดี' },
        { title: 'ชื่อผู้จอง' },
        { title: 'แผนก' },
        { title: 'รถ' },
        { title: 'สถานที่ๆไปติดต่อ' },
        { title: 'วันที่ออก' },
        { title: 'เวลาออก' },
        { title: 'วันที่เข้า' },
        { title: 'เวลาเข้า' },
        { title: 'คนขับ' },
        { title: 'อื่นๆ' },
        { title: 'สถานะ' ,    
        targets: 11,
           render: function (data) {    
        if (data === "อนุมัติ") {
        return `<span class='badge bg-success text-white sfont' 
                    data-bs-toggle="modal" 
                    data-bs-target="#car_cancelbook"  type="button"
                    onclick="cancelcarbookeditData(this);"><i class="fa-regular fa-clock fa-beat-fade"></i>อนุมัติ</span>`;
        }else if(data ==="รออนุมัติ") {
        data = `<span class='badge bg-warning text-white sfont' 
                    data-bs-toggle="modal" 
                    data-bs-target="#car_cancelbook"  type="button"
                    onclick="cancelcarbookeditData(this);"><i class="fa-regular fa-clock fa-beat-fade"></i>รออนุมัติ</span>`;
        }else if(data ==="ไม่อนุมัติ") {
        data = "<span class='badge bg-danger text-white sfont'>ไม่อนุมัติ</span>";
        }else if(data ==="ยกเลิกการจองรถ") {
        data = "<span class='badge bg-danger text-white sfont'>ยกเลิกการจองรถ</span>";
        }else if(data ==="ส่งคืน") {
        data = "<span class='badge bg-info text-white sfont'>ส่งคืน</span>";
        }else if(data ==="กำลังใช้งาน") {
        data = "<span class='badge bg-primary text-white sfont'>กำลังใช้งาน</span>";
        }
        return data;
        }
        }, 
        { title: 'ผู้อนุมัติ' },
        // { title: 'แก้ไข' ,    
        // targets: 17,
        //     data: null,
        //     defaultContent: '&nbsp&nbsp&nbsp<i class="fa-solid fa-pencil fa-xl" style="color: green; cursor: pointer;" data-bs-toggle="modal" data-bs-target="#carin" onclick="cancelcarbookeditData(this);"></i>',
        // },
    ],
    data: dataSet,
    responsive: true,
    destroy:true,
      language: {
        url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/th.json',
    },
    
    "destroy": true,
      order: [[0, 'asc']],
      columnDefs:[
          {
          targets: [11],className: 'all',},
       ],
      //จำกัดให้แสดงปุ่มหน้าตามจำนวนที่ต้องการ
         initComplete: function(settings){
          var api = new $.fn.dataTable.Api( settings );
          $('.table-filter-container', api.table().container()).append(
          );

           $('#table-filter select').on('change', function(){
             table.columns(11).search(this.value).draw();   
          });
          }
      });    
        //It will show only 4 pager buttons.
    $.fn.DataTable.ext.pager.numbers_length = 5;
    }

  function cancelcarbooktsearchData(obj) {
      event.preventDefault()
        Swal.fire({
            position: 'center',
            title: '<i class="fa-solid fa-truck-fast fa-beat"></i><h4><br>กำลังค้นหาข้อมูล...</h4>',
            showConfirmButton: false,
          })
           Swal.showLoading()
            google.script.run.withSuccessHandler(data=>{
              if(data != ''){
                cancelcarbookshowDatauser(data)
                const Toast = Swal.mixin({
                  toast: true,
                  position: 'top-end',
                  showConfirmButton: false,
                  timer: 3000,
                  timerProgressBar: true,
                  didOpen: (toast) => {
                    toast.addEventListener('mouseenter', Swal.stopTimer)
                    toast.addEventListener('mouseleave', Swal.resumeTimer)
                  }
                })

                Toast.fire({
                  icon: 'success',
                  title: 'พบข้อมูลที่ท่านจองไว้แล้ว'
                })
              }else{
                  Swal.fire({
                    position: 'top',
                    icon: 'warning',
                    title:'แจ้งให้ทราบ',
                    text: 'ชื่อผู้ใช้นี้ยังไม่ได้รับการอนุมัติจากผู้ดูแลระบบ หรือยังไม่ได้มีการจองรถเข้ามา',
                    showConfirmButton: false,
                    timer: 3000
                  })
              }
              // $('#showtb_carin').show()
              // document.getElementById("cancelcarbooktmyForm").reset();
            }).cancelcar_searchData(obj);
            
            }
    
function cancelcarbookeditData(el){
  var numid_canceluser = el.parentNode.parentNode.cells[0].innerText
  var name_canceluser = el.parentNode.parentNode.cells[1].innerText
  var dep_canceluser = el.parentNode.parentNode.cells[2].innerText
  var car_canceluser = el.parentNode.parentNode.cells[3].innerText
  var loca_canceluser = el.parentNode.parentNode.cells[4].innerText
  var startDate_canceluser = el.parentNode.parentNode.cells[5].innerText
  var startTime_canceluser = el.parentNode.parentNode.cells[6].innerText
  var endDate_canceluser = el.parentNode.parentNode.cells[7].innerText
  var endTime_canceluser = el.parentNode.parentNode.cells[8].innerText
  var drive_canceluser = el.parentNode.parentNode.cells[9].innerText
  var other_canceluser = el.parentNode.parentNode.cells[10].innerText
  //var preapporved_canceluser = el.parentNode.parentNode.cells[11].innerText
  // var apporve_cancelcarbookuser = el.parentNode.parentNode.cells[12].innerText
  // var dateout_cancelcarbookuser = el.parentNode.parentNode.cells[13].innerText
  // var timeout_cancelcarbookuser = el.parentNode.parentNode.cells[14].innerText
  // var mileout_cancelcarbookuser = el.parentNode.parentNode.cells[15].innerText
  // var datecancelcarbookuser = el.parentNode.parentNode.cells[7].innerText

  var driver_canceluser = el.parentNode.parentNode.cells[1].innerText
  

 
  
    
// console.log(record)
    document.getElementById('numid_canceluser').value = numid_canceluser
    document.getElementById('name_canceluser').value = name_canceluser
    document.getElementById('dep_canceluser').value = dep_canceluser
    document.getElementById('car_canceluser').value = car_canceluser
    document.getElementById('loca_canceluser').value = loca_canceluser
    document.getElementById('startDate_canceluser').value = startDate_canceluser
    document.getElementById('startTime_canceluser').value = startTime_canceluser
    document.getElementById('endDate_canceluser').value = endDate_canceluser
    document.getElementById('endTime_canceluser').value = endTime_canceluser
    document.getElementById('drive_canceluser').value = drive_canceluser
    document.getElementById('other_canceluser').value = other_canceluser
    //document.getElementById('preapporved_canceluser').value = preapporved_canceluser
    //document.getElementById('apporve_cancelcarbookuser').value = apporve_cancelcarbookuser


    document.getElementById('driver_canceluser').value = driver_canceluser

  }


    function cancelcarbooksubmitForm(obj){
        event.preventDefault()
          Swal.fire({
            position: 'center',
            title: '<i class="fa-solid fa-download fa-bounce me-2"></i><h4><br>กำลังบันทึกข้อมูล...</h4>',
            showConfirmButton: false,
          })
           Swal.showLoading()
       google.script.run.withSuccessHandler(cancelcarbookaddSuccess).cancelRecorduser(obj)
       
       }
      function cancelcarbookaddSuccess(result){
       if(result == true){
          //document.getElementById('cancelcarbookmyForm').reset()
          Swal.fire({
            position: 'center',
            icon: 'success',
           
            text: 'ยกเลิกการจองรถเรียบร้อยแล้ว',
            //showConfirmButton: true,
            showConfirmButton: false,
            timer: 2500
           })
           document.getElementById("cancelcarbookbtn-close").click(); 
          
           $('#showtb_carcancel').hide()
      }
       }
       
        
  </script>


  </html>
