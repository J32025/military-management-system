<script>
    google.script.run.withSuccessHandler(checkcarshowData).checkcargetdata()

    function checkcarshowData(dataSet) {
    // เพิ่มคอลัมน์ว่างใน dataSet ถ้าจำนวนคอลัมน์ไม่ตรงกับที่ต้องการ
    dataSet = dataSet.map(row => {
        while (row.length < 19) { // 19 คือจำนวนคอลัมน์ที่ต้องการ (0-18)
            row.push(''); // เพิ่มคอลัมน์ว่าง
        }
        return row;
    });

    table = new DataTable('#checkbookcar', {
        columns: [
            { title: 'ลำดับ', width: '3%' }, // กำหนดความกว้าง 3%
            { title: 'หมายเลขห้อง', width: '5%' }, // กำหนดความกว้าง 5%
            { title: 'พื้นที่', width: '7%' }, // กำหนดความกว้าง 7%
            { title: 'ชั้น', width: '5%' }, // กำหนดความกว้าง 5%
            { title: 'หมายเลขอาคาร', width: '7%' }, // กำหนดความกว้าง 7%
            { title: 'ประเภท', width: '5%' }, // กำหนดความกว้าง 5%
            { title: 'ยศ', width: '5%' }, // กำหนดความกว้าง 5%
            { title: 'ชื่อ', width: '7%' }, // กำหนดความกว้าง 7%
            { title: 'นามสกุล', width: '7%' }, // กำหนดความกว้าง 7%
            { title: 'ตำแหน่ง', width: '7%' }, // กำหนดความกว้าง 7%
            { title: 'สังกัด', width: '7%' }, // กำหนดความกว้าง 7%
            { title: 'สถานะการจัด', width: '7%' }, // กำหนดความกว้าง 7%
            { title: 'จำนวนผู้พักอาศัยตามทะเบียนบ้าน', width: '10%' }, // กำหนดความกว้าง 10%
            { title: 'รายชื่อผู้พักอาศัยในทะเบียนบ้าน', width: '10%' }, // กำหนดความกว้าง 10%
            { title: 'เบอร์โทร', width: '7%' }, // กำหนดความกว้าง 7%
            { title: 'พักอาศัยเอง', width: '5%' }, // กำหนดความกว้าง 5%
            { title: 'ให้ญาติพัก', width: '5%' }, // กำหนดความกว้าง 5%
            { title: 'ไม่อยู่บ้าน', width: '5%' }, // กำหนดความกว้าง 5%
            {
                title: 'รายละเอียด', // ย้ายคอลัมน์ "รายละเอียด" ไปไว้ที่ตำแหน่งสุดท้าย
                width: '7%', // กำหนดความกว้าง 7%
                render: function (data) {
                    if (data === "Active") {
                        return `<span class='badge bg-success text-white sfont'
                                    data-bs-toggle="modal"
                                    data-bs-target="#approveform2" type="button"
                                    onclick="approveeditData2(this);"></i>ดูข้อมูล</span>`;
                    } else if (data === "InActive") {
                        data = "<span class='badge bg-danger text-white sfont'>ว่าง</span>";
                    } else if (data === "ไม่อนุมัติ") {
                        data = "<span class='badge bg-danger text-white sfont'>ไม่อนุมัติ</span>";
                    } else if (data === "ยกเลิกการจองรถ") {
                        data = "<span class='badge bg-danger text-white sfont'>ยกเลิกการจองรถ</span>";
                    } else if (data === "ส่งคืน") {
                        data = "<span class='badge bg-info text-white sfont'>ส่งคืน</span>";
                    } else if (data === "กำลังใช้งาน") {
                        data = "<span class='badge bg-primary text-white sfont'>กำลังใช้งาน</span>";
                    }
                    return data;
                }
            }
        ],
        data: dataSet.slice(1),
        bFilter: true,
        responsive: true, // เปิดใช้งาน responsive
        language: {
            url: '//cdn.datatables.net/plug-ins/1.13.5/i18n/th.json',
        },
        "destroy": true,
        order: [[0, 'asc']],
        columnDefs: [
            // {
            //     targets: '_all', // กำหนดให้ทุกคอลัมน์มีความกว้างเท่ากัน
            //     className: 'dt-center', // จัดข้อความตรงกลาง
            // },
            {
                targets: [1, 6, 7, 18], // คอลัมน์ที่ต้องการแสดงบนหน้าจอขนาดเล็ก (ลำดับ, หมายเลขห้อง, ยศ, ชื่อ, สกุล, สังกัด, ปุ่มดูข้อมูล)
                className: 'all', // แสดงบนหน้าจอทุกขนาด
            },
            {
                targets: [0, 2, 3, 4,5,8,9,10,11,12,13,14,15,16], // คอลัมน์ที่ 8 (เริ่มนับจาก 0)
                className: 'dt-left', // ใช้คลาสที่กำหนดให้ข้อความชิดซ้าย
            },
        ],
        initComplete: function (settings) {
            var api = new $.fn.dataTable.Api(settings);
            $('.table-filter-container', api.table().container()).append(
            );

            $('#table-filter select').on('change', function () {
                table.columns(18).search(this.value).draw();
            });
        }
    });
    //It will show only 4 pager buttons.
    $.fn.DataTable.ext.pager.numbers_length = 5;
}
