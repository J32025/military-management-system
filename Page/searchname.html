<div class="table-responsive" id="show_searchname">

<script>

function clickopenPage_edit(){

    document.getElementById('search9').click()
    
    }

function search_name_Data(obj) {
      event.preventDefault()
        Swal.fire({
            position: 'center',
            title: '<i class="fa-solid fa-magnifying-glass fa-beat"></i><h4><br>กำลังค้นหาข้อมูล...</h4>',
            showConfirmButton: false,
          })
           Swal.showLoading()
            google.script.run.withSuccessHandler(data=>{
              if(data != ''){
                searchshowData(data)
                const Toast = Swal.mixin({
                  toast: true,
                  position: 'top-end',
                  showConfirmButton: false,
                  timer: 3000,
                  timerProgressBar: true,
                  didOpen: (toast) => {
                    toast.addEventListener('mouseenter', Swal.stopTimer)
                    toast.addEventListener('mouseleave', Swal.resumeTimer)
                  }
                })

                Toast.fire({
                  icon: 'success',
                  title: 'พบข้อมูล'
                })
                  $('#show_searchname').show()
              }else{
                  Swal.fire({
                    position: 'top',
                    icon: 'warning',
                    title:'แจ้งให้ทราบ',
                    text: 'ไม่พบข้อมูล',
                    showConfirmButton: false,
                    timer: 3000
                  })
                  $('#show_searchname').hide()
              }
            
            
            }).searchnameData(obj);
            
            }

function searchshowData(dataSet){
    table = new DataTable('#searchname_table', {
        columns: [
        { title: 'เลขที่ชุด'},  
        { title: 'เลขประจำตัว'},  
        // { visible: false, searchable: false },
        // { visible: false, searchable: false },
        { title: 'ยศ ชื่อ สกุล', responsivePriority: 1 },
        // { visible: false, searchable: false },
        { title: 'ตำแหน่ง'},  
        { title: 'สังกัด'},
        { title: 'หัวหน้าชุด'},
        { title: 'ประเภท'},
        { title: 'วันที่เริ่มต้น'},
        { title: 'วันที่สิ้นสุด'},
        { title: 'เลขที่หนังสือ'},
        { title: 'ชื่อเรื่อง'},
        { title: 'สถานที่'},
        { title: 'อื่นๆ'},
        { title: 'ชื่อผู้บันทึก'},
        { visible: false, searchable: false },
        { visible: false, searchable: false },
        { visible: false, searchable: false },
        { title: 'สถานะ' ,    
        targets: 17,
           render: function (data) {    
            if(data ==="รออนุมัติ"){
            data = "<span class='badge bg-yellow text-white sfont'>รออนุมัติ</span>";
            }else if(data ==="อนุมัติ") {
            data = "<span class='badge bg-success text-white sfont'>อนุมัติ</span>";
            }else if(data ==="ไม่อนุมัติ") {
            data = "<span class='badge bg-danger text-white sfont'>ไม่อนุมัติ</span>";
            }else if(data ==="ยกเลิก") {
            data = "<span class='badge bg-danger text-white sfont'>ยกเลิกการจองรถ</span>";
            }else if(data ==="ส่งคืน") {
            data = "<span class='badge bg-info text-white sfont'>ส่งคืน</span>";
            }else if(data ==="กำลังใช้งาน") {
            data = "<span class='badge bg-primary text-white sfont'>กำลังใช้งาน</span>";
            }
            return data;
            }
        }, 
        { title: 'แก้ไข' ,    
        targets: 18,
            data: null,
            defaultContent: '&nbsp&nbsp&nbsp<i class="fa-solid fa-pencil fa-xl" style="color: red; cursor: pointer;" data-bs-toggle="modal" data-bs-target="#searcheditform" onclick="searcheditData(this);"></i>',
        }, 

    ],
        data: dataSet,
        responsive: true,
        destroy: true,
        language: {
            url: '//cdn.datatables.net/plug-ins/1.13.5/i18n/th.json',
        },
        order: [[1, 'asc']],
        columnDefs: [
            { targets: [18], className: 'all' },
        ],
        initComplete: function(settings) {
            var api = new $.fn.dataTable.Api(settings);
            $('.table-filter-container', api.table().container()).append();
            $('#table-filter select').on('change', function() {
                table.columns(18).search(this.value).draw();
            });
        }
    });

    // It will show only 4 pager buttons.
    $.fn.DataTable.ext.pager.numbers_length = 5;
}
