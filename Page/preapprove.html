function search_name_preData(obj) {
      event.preventDefault()
        Swal.fire({
            position: 'center',
            title: '<i class="fa-solid fa-magnifying-glass fa-beat"></i><h4><br>กำลังค้นหาข้อมูล...</h4>',
            showConfirmButton: false,
          })
           Swal.showLoading()
            google.script.run.withSuccessHandler(data=>{
              if(data != ''){
                preapproveshowData(data)
                const Toast = Swal.mixin({
                  toast: true,
                  position: 'top-end',
                  showConfirmButton: false,
                  timer: 3000,
                  timerProgressBar: true,
                  didOpen: (toast) => {
                    toast.addEventListener('mouseenter', Swal.stopTimer)
                    toast.addEventListener('mouseleave', Swal.resumeTimer)
                  }
                })

                Toast.fire({
                  icon: 'success',
                  title: 'พบข้อมูล'
                })
                  $('#search_name_preapprove').show()
              }else{
                  Swal.fire({
                    position: 'top',
                    icon: 'warning',
                    title:'แจ้งให้ทราบ',
                    text: 'ไม่พบข้อมูล',
                    showConfirmButton: false,
                    timer: 3000
                  })
                  $('#search_name_preapprove').hide()
              }
            
            
            }).searchPreapprove(obj);
            
            }

const { PDFDocument, rgb } = PDFLib;

/** ======open file pdf========= **/
   async function openfile(el){
        event.preventDefault()
        const dep_preapprove1 = el.parentNode.parentNode.cells[0].innerText;
        const dep_preapprove = el.parentNode.parentNode.cells[1].innerText;
        const loca_preapprove = el.parentNode.parentNode.cells[2].innerText;
        const startDate_preapprove = el.parentNode.parentNode.cells[3].innerText;
        const startTime_preapprove = el.parentNode.parentNode.cells[4].innerText;
        const endDate_preapprove = el.parentNode.parentNode.cells[5].innerText;
        const endTime_preapprove = el.parentNode.parentNode.cells[6].innerText;
        const dropdowndrive_checkcar = el.parentNode.parentNode.cells[7].innerText;
        const other_preapprove = el.parentNode.parentNode.cells[8].innerText;
        const numid_preapprove = el.parentNode.parentNode.cells[9].innerText;
        const name_preapprove = el.parentNode.parentNode.cells[10].innerText;
        const add_preapprove = el.parentNode.parentNode.cells[11].innerText;

        // Create a PDFDocument instance
        const pdfDoc = await PDFDocument.create();

        // Register fontkit instance with the PDFDocument
        pdfDoc.registerFontkit(fontkit);

        // Fetch and embed the Thai font
        const thaiFontBytes = await fetch('https://sanwithz.github.io/font/THSarabunNew.ttf').then(res => res.arrayBuffer());
        const thaiFont = await pdfDoc.embedFont(thaiFontBytes);
        const page = pdfDoc.addPage();
        const { width, height } = page.getSize();
        const fontSize = 14;

        const imageFileUrl = 'https://lh3.googleusercontent.com/d/1yLxfGUm1klJBxqwfaXHxzewgYcEPjvof';
        const response = await fetch(imageFileUrl);
        const imageBuffer = await response.arrayBuffer();
        const embeddedImage = await pdfDoc.embedJpg(imageBuffer);

        // หาขนาดของรูปภาพ
        const imageWidth = embeddedImage.width;
        const imageHeight = embeddedImage.height;

        // คำนวณขนาดที่ต้องการขยายรูปภาพ
        const scaleWidth = width / imageWidth;
        const scaleHeight = height / imageHeight;
        const scale = Math.min(scaleWidth, scaleHeight); // เลือกค่า scale ที่น้อยที่สุด

        // คำนวณตำแหน่งของรูปภาพที่ต้องการแสดง
        const imageX = (width - (imageWidth * scale)) / 2; // จัดให้อยู่ตรงกลาง
        const imageY = (height - (imageHeight * scale)) / 2; // จัดให้อยู่ตรงกลาง

        // แสดงรูปภาพในหน้า PDF โดยใช้ขนาดและตำแหน่งที่คำนวณไว้
        page.drawImage(embeddedImage, {
            x: imageX,
            y: imageY,
            width: imageWidth * scale,
            height: imageHeight * scale
        });
        //เลขชุดที่: 
        page.drawText(`เลขชุดที่ : ${dep_preapprove1}`, {
          x: 500,
          y: height - 10 * fontSize,
          size: fontSize,
          font: thaiFont,  // Use the Thai font here
          color: rgb(0, 0, 0),
        });      
        //ยศ ชื่อ สกุล: 
        page.drawText(`${dep_preapprove}`, {
          x: 96,
          y: height - 22.35 * fontSize,
          size: fontSize,
          font: thaiFont,  // Use the Thai font here
          color: rgb(0, 0, 0),
        });      
        // สังกัด: 
        page.drawText(`สังกัด : ${loca_preapprove}`, {
            x: 330,
            y: height - 22.35 * fontSize,
            size: fontSize,
            font: thaiFont,
            color: rgb(0, 0, 0),
        });
        // ส่วนราชการ: 
        page.drawText(`${loca_preapprove}`, {
            x: 430,
            y: height - 10.35 * fontSize,
            size: fontSize,
            font: thaiFont,
            color: rgb(0, 0, 0),
        });
        // ผู้บันทึก: 
        page.drawText(`${add_preapprove}`, {
            x: 140,
            y: height - 16.5 * fontSize,
            size: fontSize,
            font: thaiFont,
            color: rgb(0, 0, 0),
        });
        // ผู้บันทึก: 
        page.drawText(`${add_preapprove}`, {
            x: 328,
            y: height - 32.8 * fontSize,
            size: fontSize,
            font: thaiFont,
            color: rgb(0, 0, 0),
        });
        //ประเภท: 
        page.drawText(`${startTime_preapprove}`, {
            x: 400,
            y: height - 18.4 * fontSize,
            size: fontSize,
            font: thaiFont,
            color: rgb(0, 0, 0),
        });
        //วันที่เริ่ม: 
        page.drawText(`${endDate_preapprove}`, {
            x: 150,
            y: height - 20.32 * fontSize,
            size: fontSize,
            font: thaiFont,
            color: rgb(0, 0, 0),
        });
        //วันที่สิ้นสุด: 
        page.drawText(`${endTime_preapprove}`, {
            x: 270,
            y: height - 20.32 * fontSize,
            size: fontSize,
            font: thaiFont,
            color: rgb(0, 0, 0),
        });
        //สถานที่: 
        page.drawText(`${numid_preapprove}`, {
            x: 380,
            y: height - 20.32 * fontSize,
            size: fontSize,
            font: thaiFont,
            color: rgb(0, 0, 0),
        });

        const currentDate = new Date();
        const currentDateTimeString = currentDate.toLocaleString(); // วันที่และเวลาปัจจุบันเป็นข้อความ

        // ปรับค่า y เพื่อให้ข้อความประทับอยู่ด้านล่างของหน้า
        const textYPosition = 50;

        // ปรับค่า fontSize ตามต้องการ
        const timeFontSize = 14;

        // ประทับข้อความเวลาด้านล่างของหน้า
        page.drawText(`วันเวลาที่ทำรายการ : ${currentDateTimeString}`, {
        x: 370,
        y: textYPosition,
        size: timeFontSize,
        font: thaiFont,
        color: rgb(0, 0, 0),
        });

        const pdfBytes = await pdfDoc.save();
        const fileName = `${dep_preapprove}_${currentDateTimeString}.pdf`;
        download(pdfBytes, fileName, "application/pdf");

        // download(pdfBytes, "pdf-lib_creation_example.pdf", "application/pdf");

}
