function approveshowData(dataSet) {
    // ตรวจสอบว่า dataSet มีข้อมูลหรือไม่
    if (!dataSet || !Array.isArray(dataSet)) {
        console.error('ไม่มีข้อมูลหรือข้อมูลไม่ถูกต้อง');
        return;
    }

    // Ensure each row has the required number of columns
    dataSet = dataSet.map(row => {
        while (row.length < 20) { // เพิ่มเป็น 20 คอลัมน์เพื่อรองรับ URL รูปภาพ
            row.push('');
        }
        return row;
    });

    // Initialize DataTable
    const table = new DataTable('#approve', {
        columns: [
            { title: 'ลำดับ', width: '2%' },
            { title: 'ห้อง', width: '10%' },
            { 
                title: 'ยศและชื่อ', width: '15%',
                render: function (data, type, row) {
                    // ตรวจสอบว่า row[6], row[7], row[8] มีค่าหรือไม่
                    const rank = row[6] || '';
                    const firstName = row[7] || '';
                    const lastName = row[8] || '';
                    return `${rank} ${firstName} ${lastName}`.trim();
                }
            },
            {
                title: 'รายละเอียด', width: '5%',
                render: function (data, type, row) {
                    // ตรวจสอบว่า row[1] มีค่าหรือไม่
                    const roomNumber = row[1] || '';
                    return `<span class='badge bg-success text-white sfont'
                                data-bs-toggle="modal"
                                data-bs-target="#approveform" type="button"
                                onclick="fetchRoomData('${roomNumber}');">ดูข้อมูล</span>`;
                }
            }
        ],
        data: dataSet.length > 1 ? dataSet.slice(1) : [], // ป้องกันกรณี dataSet มีแค่ header
        bFilter: true,
        responsive: true,
        language: {
            url: '//cdn.datatables.net/plug-ins/1.13.5/i18n/th.json',
        },
        destroy: true,
        order: [[0, 'asc']],
        columnDefs: [
            {
                targets: '_all',
                className: 'dt-center',
            }
        ],
        initComplete: function (settings) {
            const api = new $.fn.dataTable.Api(settings);
            // ตรวจสอบว่า element ที่จะ append มีหรือไม่
            if ($('.table-filter-container', api.table().container()).length) {
                $('.table-filter-container', api.table().container()).append();
            }
            
            // ตรวจสอบว่า table-filter มีหรือไม่
            $('#table-filter select').on('change', function () {
                table.columns(3).search(this.value).draw();
            });
        }
    });

    // Limit the number of pager buttons
    $.fn.DataTable.ext.pager.numbers_length = 5;
}

function approveeditData(data) {
    // ตรวจสอบว่า data มีค่าหรือไม่
    if (!data || !Array.isArray(data)) {
        console.error('ข้อมูลที่ได้รับไม่ถูกต้อง');
        return;
    }
    
    // ฟังก์ชันช่วยกำหนดค่า element แบบปลอดภัย
    function setValueSafely(elementId, value) {
        const element = document.getElementById(elementId);
        if (element) {
            element.value = value || '';
        } else {
            console.warn(`ไม่พบ element ที่มี ID: ${elementId}`);
        }
    }

    // กำหนดค่าในฟอร์ม
    setValueSafely('numid_approve', data[0]);
    setValueSafely('name_approve', data[1]);
    setValueSafely('dep_approve', data[2]);
    setValueSafely('car_approve', data[3]);
    setValueSafely('loca_approve', data[4]);
    setValueSafely('startDate_approve', data[5]);
    setValueSafely('startTime_approve', data[6]);
    setValueSafely('endDate_approve', data[7]);
    setValueSafely('endTime_approve', data[8]);
    setValueSafely('drive_approve', data[9]);
    setValueSafely('other_approve_approve_1', data[10]);
    setValueSafely('other_approve_approve_2', data[11]);
    setValueSafely('other_approve_approve_3', data[12]);
    setValueSafely('other_approve_approve_4', data[13]);
    setValueSafely('other_approve_approve_5', data[14]);
    setValueSafely('other_approve_approve_6', data[15]);
    setValueSafely('other_approve_approve_7', data[16]);
    setValueSafely('other_approve_approve_8', data[17]);
    setValueSafely('other_approve_approve_9', data[18]);

    // อัปเดตสถานะ checkbox ตามข้อมูล
    updateCheckbox('other_approve_approve_6_check', data[15]);
    updateCheckbox('other_approve_approve_7_check', data[16]);
    updateCheckbox('other_approve_approve_8_check', data[17]);

    // ตรวจสอบว่ามี URL ของรูปภาพหรือไม่
    const profileImage = document.getElementById('profileImage');
    if (profileImage && data[19]) {
        profileImage.src = data[19];
    } else if (profileImage) {
        profileImage.src = "https://img2.pic.in.th/pic/Untitled-designa64a7773ec4d81e9.png"; // ใช้รูปภาพตัวอย่างถ้าไม่มี URL
    }
}

// ฟังก์ชันช่วยอัปเดตสถานะ checkbox
function updateCheckbox(elementId, value) {
    const checkbox = document.getElementById(elementId);
    if (checkbox) {
        checkbox.checked = value === 'true' || value === true || value === '1' || value === 1;
    }
}

function fetchRoomData(roomNumber) {
    // ตรวจสอบว่า roomNumber มีค่าหรือไม่
    if (!roomNumber) {
        alert('หมายเลขห้องไม่ถูกต้อง');
        return;
    }

    // ตั้งค่าและแสดง LoadingOverlay
    if (typeof $.LoadingOverlay === 'function') {
        $.LoadingOverlaySetup({
            background      : "rgba(0, 0, 0, 0.5)",
            image           : "https://img2.pic.in.th/pic/Untitled-designa64a7773ec4d81e9.png",
            imageAnimation  : "1.5s fadein",
            imageColor      : "#ffcc00"
        });
        $.LoadingOverlay("show");
    } else {
        console.warn('LoadingOverlay ไม่ได้ถูกโหลด');
    }

    // เรียก Google Apps Script เพื่อดึงข้อมูล
    google.script.run
        .withSuccessHandler(handleRoomData)
        .withFailureHandler(handleError)
        .fetchDataByRoom(roomNumber);
}

function handleRoomData(data) {
    // ซ่อน LoadingOverlay เมื่อได้รับข้อมูล
    if (typeof $.LoadingOverlay === 'function') {
        $.LoadingOverlay("hide");
    }

    // ตรวจสอบข้อมูลและแสดงในฟอร์ม
    if (data && data.length > 0) {
        approveeditData(data[0]);
    } else {
        alert('ไม่พบข้อมูลสำหรับห้องนี้');
    }
}

function handleError(error) {
    // ซ่อน LoadingOverlay เมื่อเกิดข้อผิดพลาด
    if (typeof $.LoadingOverlay === 'function') {
        $.LoadingOverlay("hide");
    }
    
    alert('เกิดข้อผิดพลาด: ' + (error && error.message ? error.message : 'ไม่ทราบสาเหตุ'));
}

// ฟังก์ชัน submit form (เพิ่มเติม)
function approvesubmitForm(form) {
    event.preventDefault(); // ป้องกันการ refresh หน้า
    
    // ตั้งค่าและแสดง LoadingOverlay
    if (typeof $.LoadingOverlay === 'function') {
        $.LoadingOverlay("show");
    }
    
    // สร้าง FormData จากฟอร์ม
    const formData = new FormData(form);
    const data = {};
    
    // แปลง FormData เป็น Object
    for (const [key, value] of formData.entries()) {
        data[key] = value;
    }
    
    // ส่งข้อมูลไปยัง Google Apps Script
    google.script.run
        .withSuccessHandler(function(response) {
            if (typeof $.LoadingOverlay === 'function') {
                $.LoadingOverlay("hide");
            }
            alert('บันทึกข้อมูลสำเร็จ');
            $('#approveform').modal('hide');
            // รีโหลดข้อมูล
            google.script.run.withSuccessHandler(approveshowData).approvegetdata();
        })
        .withFailureHandler(function(error) {
            if (typeof $.LoadingOverlay === 'function') {
                $.LoadingOverlay("hide");
            }
            alert('เกิดข้อผิดพลาด: ' + (error && error.message ? error.message : 'ไม่ทราบสาเหตุ'));
        })
        .updateApproveData(data); // ต้องสร้างฟังก์ชัน updateApproveData ใน Google Apps Script
}
