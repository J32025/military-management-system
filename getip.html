function showTab(n) {
  var x = document.getElementsByClassName("step");
  x[n].style.display = "block";
  if (n == 0) {
    document.getElementById("prevBtn").style.display = "none";
    $("#cancelregictor").show();
  } else {
    $("#cancelregictor").hide();
    document.getElementById("prevBtn").style.display = "inline";
  }

    $("#step1").show();
    $("#step2").hide();
    $("#step3").hide();
    $("#step4").hide();
    $("#nextBtn").show();
    $("#saveregictor").hide();
    $("#nextBtn").prop("disabled", false);
  } else if (n == 1) {
    $("#step1").hide();
    $("#step2").show();
    $("#step3").hide();
    $("#step4").hide();
    $("#nextBtn").show();
    $("#saveregictor").hide();

    $("#nextBtn").show();
    $("#saveregictor").hide();

  } else if (n == 3) {
    $("#step1").hide();
    $("#step2").hide();
    $("#step3").hide();
    $("#step4").show();
    $("#nextBtn").hide();
    $("#saveregictor").show();
  }
  fixStepIndicator(n)
}
        
function nextPrev(n) {
  var x = document.getElementsByClassName("step");
  if (n == 1 && !validateForm()) return false;
  x[currentTab].style.display = "none";
  currentTab = currentTab + n;
  if (currentTab >= x.length) {
    document.getElementById("stapregictor").submit();
    return false;
  }
  showTab(currentTab);
}
        
function validateForm() {
  var x, y, i, valid = true;
  x = document.getElementsByClassName("step");
  y = x[currentTab].getElementsByTagName("input");
  for (i = 0; i < y.length; i++) {
    if (y[i].value == "") {
      y[i].className += " invalid";
      valid = false;
    }
  }
  if (valid) {
    document.getElementsByClassName("stepIndicator")[currentTab].className += " finish";
  }
  return valid; 
}
        
function fixStepIndicator(n) {
  var i, x = document.getElementsByClassName("stepIndicator");
  for (i = 0; i < x.length; i++) {
    x[i].className = x[i].className.replace(" active", "");
  }
  x[n].className += " active";
}

async function getIPAddress() {
  const ipAPI = "//api.ipify.org?format=json";
  const response = await fetch(ipAPI); 
  const data = await response.json(); 
  const inputValue = data.ip;
  
  return inputValue;
}
async function loginCheck() {
  $("#loader").show();
  var usernameGeneral = $("#loguser").val();
  var passwordGeneral = $("#logpass").val();
  var rememberMe = document.getElementById("rememberMe");
  
  const ipCheck = await getIPAddress();
  const userAgent = navigator.userAgent;

  google.script.run.withSuccessHandler(function(user) {
    if (user && user !== '⚠️ ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง' && user !== '⚠️ ชื่อผู้ใช้งานนี้ถูกระงับการใช้งาน') {
      toastAlert('🔓 เข้าสู่ระบบสำเร็จ ยินดีต้อนรับ' + user.name , 'text-bg-success');
      localStorage.setItem('isLoggedIn', 'true');
      localStorage.setItem('codeID', user.codeID);
      localStorage.setItem('username', user.username);
      localStorage.setItem('password', user.password);
      localStorage.setItem('name', user.name);
      localStorage.setItem('tel', user.tel);
      localStorage.setItem('email', user.email);
      localStorage.setItem('address', user.address);
      localStorage.setItem('imgProfile', user.imgProfile);
      localStorage.setItem('tokenLine', user.tokenLine);
      localStorage.setItem('levelID', user.levelID);
      localStorage.setItem('status', user.status); 
      localStorage.setItem('coin', user.coin); 
      localStorage.setItem('qrpayment', user.qrpayment); 
      loginsuccess(user);   
      if (user.imgProfile === "") {
        $("#btnUploadimageModal").click()
      }
      $("#btnbuyProjectNow").show();
      if (rememberMe.checked) {
        localStorage.setItem('usernameSave', usernameGeneral);
        localStorage.setItem('passwordSave', passwordGeneral);
        localStorage.setItem('checked', 'checked');
      } else {
        localStorage.removeItem('usernameSave');
        localStorage.removeItem('passwordSave');
        localStorage.removeItem('checked'); 
      }
    } else {
      toastAlert(user, 'text-bg-danger');
      $("#btnbuyProjectNow").hide();
    }
  }).checkLoginSystem(usernameGeneral, passwordGeneral, ipCheck, userAgent);
}

var searchInput = document.getElementById("searchName");
searchInput.addEventListener('input', searchForData);

function searchForData() {
  var keyWord = document.getElementById("searchName").value;
  var searchTerm = searchInput.value.toLowerCase();
  var searchData = allData.filter(function(researchData) {
    for (var i = 0; i < researchData.length; i++) {
      if (researchData[i] !== null && researchData[i].toString().toLowerCase().includes(searchTerm)) {
          $("#breadcrumbA").removeClass('active');
          $("#breadcrumbName").show();
          $("#nameActive").addClass('active').show().text('ค้นหา : ' + keyWord);
        return true;
      }
    }
    return false;
  });

  showAllDataProject(searchData);
}
